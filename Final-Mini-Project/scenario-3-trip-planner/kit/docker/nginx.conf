# The Rihla web app in Docker: static files, React Router's client-side routes, and /api forwarded to the backend
# service (same origin for the page and the API, like the Vite dev proxy in rihla-frontend/vite.config.js).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the app service through Docker's DNS when a request comes in, not once at start-up: nginx then starts
    # even before app exists, and follows app to its new address after `docker compose up` recreates it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://app:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        # Keep the browser's Host and Origin: the backend's sign-in checks them (RIHLA_ALLOWED_ORIGINS, cookies).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A full plan takes one to two minutes; the page itself gives up after five (tripApi.js).
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    location = /health {
        proxy_pass $backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
