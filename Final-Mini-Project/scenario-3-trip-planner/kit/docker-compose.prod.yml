# Production overlay for a public deployment. From kit/, always together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet   # check first
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
#
# What it changes (see docs/deployment-readiness.md):
# - RIHLA_ENV=production, written here literally: it cannot be left out, defaulted or overridden by .env, so the
#   flight search never serves DEMO or TEST prices and Open-Meteo is used only after the licence decision;
# - TRAVEL_API_KEY must be set (compose refuses to start otherwise): the kit's public default key is not used;
# - only the web port is published: the app (8000) and the travel API (8103) are reachable only inside Docker.
# Requires Docker Compose 2.24 or newer (the !reset tag). It does not make Rihla production-ready on its own:
# saved trips and sessions are still kept in memory (docs/deployment-readiness.md, blockers).
services:
  travel-api:
    ports: !reset []
    environment:
      TRAVEL_API_KEY: ${TRAVEL_API_KEY:?Set a private TRAVEL_API_KEY (not dev-key-change-me) for production}

  app:
    ports: !reset []
    environment:
      RIHLA_ENV: production
      TRAVEL_API_KEY: ${TRAVEL_API_KEY:?Set a private TRAVEL_API_KEY (not dev-key-change-me) for production}
